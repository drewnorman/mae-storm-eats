name: Release Artifact

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  artifact:
    name: Build app artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build and verify artifact
        run: nix develop --command just test-artifact "${GITHUB_SHA}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipes-${{ github.sha }}
          path: dist/recipes-${{ github.sha }}.tar.gz
          if-no-files-found: error
