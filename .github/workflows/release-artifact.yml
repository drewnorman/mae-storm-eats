name: Publish Release Assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved v-prefixed GitHub release tag
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/drewnorman/mae-storm-eats

jobs:
  publish:
    name: Publish bundle and OCI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version package.json)" = "${version}"
          test "$(jq -r .version extension/manifest.json)" = "${version}"
          grep -Fq "Version: ${version}" plugins/mae-storm-eats/mae-storm-eats.php
          grep -Fq "Version: ${version}" themes/mae-storm-eats/style.css
          test "$(git tag --points-at HEAD | rg -Fxc "${RELEASE_TAG}")" = 1
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "revision=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build reproducible bundle
        run: nix develop --command just test-artifact "${{ steps.version.outputs.version }}"

      - name: Write checksums and compatibility notes
        shell: bash
        run: |
          cd dist
          sha256sum "mae-storm-eats-${{ steps.version.outputs.version }}.tar.gz" >SHA256SUMS
          printf '%s\n' \
            "Release ${{ steps.version.outputs.version }} compatibility" \
            "WordPress: 7.0.x; PHP: 8.3; plugin/theme/extension: ${{ steps.version.outputs.version }}" \
            "The Firefox extension is operator-managed source loaded temporarily from this tag; no XPI is published." \
            >COMPATIBILITY.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ steps.version.outputs.revision }}

      - name: Record immutable image digest
        run: printf '%s@%s\n' "${IMAGE}" "${{ steps.image.outputs.digest }}" >dist/IMAGE_DIGEST

      - name: Attach permanent release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "${RELEASE_TAG}" dist/mae-storm-eats-*.tar.gz dist/SHA256SUMS dist/COMPATIBILITY.md dist/IMAGE_DIGEST --clobber
