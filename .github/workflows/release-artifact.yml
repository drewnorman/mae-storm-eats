name: Publish Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/drewnorman/mae-storm-recipes

jobs:
  publish:
    name: Publish bundle and OCI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(jq -r .version package.json)" = "${version}"
          test "$(jq -r .version extension/manifest.json)" = "${version}"
          grep -Fq "Version: ${version}" plugins/mae-storm-recipes/mae-storm-recipes.php
          grep -Fq "Version: ${version}" themes/mae-storm-recipes/style.css
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build reproducible bundle
        run: nix develop --command just test-artifact "${{ steps.version.outputs.version }}"

      - name: Write checksums and compatibility notes
        shell: bash
        run: |
          cd dist
          sha256sum "recipes-${{ steps.version.outputs.version }}.tar.gz" >SHA256SUMS
          printf '%s\n' \
            "Release ${{ steps.version.outputs.version }} compatibility" \
            "WordPress: 7.0.x; PHP: 8.3; plugin/theme/extension: ${{ steps.version.outputs.version }}" \
            "The Firefox extension is private source loaded temporarily from this tag; no XPI is published." \
            >COMPATIBILITY.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}

      - name: Record immutable image digest
        run: printf '%s@%s\n' "${IMAGE}" "${{ steps.image.outputs.digest }}" >dist/IMAGE_DIGEST

      - name: Attach permanent release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/recipes-*.tar.gz dist/SHA256SUMS dist/COMPATIBILITY.md dist/IMAGE_DIGEST --clobber
