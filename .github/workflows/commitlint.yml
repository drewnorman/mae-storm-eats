name: Commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bootstrap
        run: nix develop --command just bootstrap

      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: nix develop --command just commitlint "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Lint latest master commit
        if: github.event_name == 'push'
        run: nix develop --command just commitlint
