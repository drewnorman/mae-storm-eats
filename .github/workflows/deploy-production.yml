name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released SemVer without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Validate released image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v${version}" --repo drewnorman/mae-storm-eats >/dev/null
          digest="$(docker buildx imagetools inspect "ghcr.io/drewnorman/mae-storm-eats:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${digest}" == sha256:* ]]
          echo "Deploying ghcr.io/drewnorman/mae-storm-eats@${digest}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy approved immutable image
        env:
          IMAGE_DIGEST: ${{ needs.resolve.outputs.digest }}
          VERSION: ${{ inputs.version }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_sha="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          gcloud compute ssh "${GCE_INSTANCE}" --project "${GCP_PROJECT_ID}" --zone "${GCE_ZONE}" --tunnel-through-iap --quiet --command \
            "sudo bash -s -- '${VERSION}' 'ghcr.io/drewnorman/mae-storm-eats@${IMAGE_DIGEST}' '${release_sha}' '${GITHUB_SHA}'" \
            < scripts/release/deploy-production-host.sh
