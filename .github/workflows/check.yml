name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bootstrap
        run: nix develop --command just bootstrap

      - name: Check production image autoload
        run: |
          docker build --target composer -f Containerfile -t mae-storm-eats-composer-check .
          docker run --rm --entrypoint php mae-storm-eats-composer-check \
            -r 'require "/src/vendor/autoload.php"; exit(class_exists("MaeStorm\\Eats\\Activation") ? 0 : 1);'

      - name: Run checks
        run: nix develop --command just check

      - name: Check Nix and infrastructure
        run: |
          nix flake check
          nix develop --command just check-infra

      - name: Boot development stack
        run: nix develop --command just test-dev-boot

      - name: Test release artifact
        run: nix develop --command just test-artifact "${GITHUB_SHA}"
