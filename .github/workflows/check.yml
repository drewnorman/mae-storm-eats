name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bootstrap
        run: nix develop --command just bootstrap

      - name: Run checks
        run: nix develop --command just check

      - name: Boot development stack
        run: nix develop --command just test-dev-boot

      - name: Test release artifact
        run: nix develop --command just test-artifact "${GITHUB_SHA}"
