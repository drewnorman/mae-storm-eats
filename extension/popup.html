<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Pinterest recipe import</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Pinterest import</h1>
      <p id="message">Configure the restricted WordPress service account.</p>
      <label>WordPress username <input id="username" autocomplete="username" /></label>
      <label>Application Password <input id="password" type="password" autocomplete="current-password" /></label>
      <button id="save">Save and verify</button>
      <div class="actions">
        <button id="start">Start / resume board</button>
        <button id="cancel">Cancel</button>
      </div>
      <progress id="progress" value="0" max="1"></progress>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
