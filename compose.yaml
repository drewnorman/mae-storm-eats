services:
  db:
    image: docker.io/library/mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: docker.io/library/wordpress:7-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://wordpress.recipes.localhost');
        define('WP_SITEURL', 'http://wordpress.recipes.localhost');
    labels:
      traefik.enable: "true"
      traefik.docker.network: local-proxy
      traefik.http.routers.recipes-wordpress.entrypoints: web
      traefik.http.routers.recipes-wordpress.rule: Host(`wordpress.recipes.localhost`)
      traefik.http.services.recipes-wordpress.loadbalancer.server.port: "80"
    networks:
      - default
      - local-proxy
    volumes:
      - wordpress-data:/var/www/html
      - ./vendor:/var/www/html/wp-content/vendor:Z
      - ./plugins/mae-storm-recipes:/var/www/html/wp-content/plugins/mae-storm-recipes:Z
      - ./themes/mae-storm-recipes:/var/www/html/wp-content/themes/mae-storm-recipes:Z
      - ./config/dev/uploads:/var/www/html/wp-content/uploads:Z

networks:
  default:
  local-proxy:
    external: true

volumes:
  db-data:
  wordpress-data:
